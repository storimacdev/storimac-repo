# Firebase App Hosting config for this Next.js app.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Set up once with (from repo root):
#   firebase apphosting:backends:create --backend storimac-web --primary-region us-central1 --root-dir web --non-interactive
#   firebase apphosting:secrets:set anthropic-api-key
# Then connect the backend to this GitHub repo via the Firebase Console
# (App Hosting > backend > Connect a repository) — that step has no CLI
# equivalent. App Hosting builds with Google Cloud Buildpacks only (no
# custom Dockerfile support — confirmed against the docs), auto-running the
# standard npm build (npm install / npm run build / npm start).
#
# This app is self-contained inside web/ (its App Hosting root directory) —
# no build step depends on anything outside this folder. That's deliberate:
# an earlier version synced system-prompts/sp01 in from a sibling directory
# via a prebuild script, and buildpack detection ("google.nodejs.runtime")
# failed against that layout. Keep it that way — don't reintroduce a
# cross-directory build dependency.

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 40
  cpuMillicores: 1000
  memoryMiB: 512

env:
  - variable: ANTHROPIC_API_KEY
    secret: anthropic-api-key
